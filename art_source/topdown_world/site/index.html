<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YANGON: Life above the neon — top-down world map</title>
<style>
html,body{margin:0;height:100%;background:#090c22;color:#58f0e0;font:13px/1.3 ui-monospace,Consolas,monospace;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;background:#0b0a1cdd;border-bottom:1px solid #35325d}
#bar b{color:#ff4fa3;margin-right:8px}
button{background:#201e3f;color:#58f0e0;border:1px solid #4f4b7b;padding:4px 9px;font:inherit;cursor:pointer;border-radius:3px}
button.on{background:#58f0e0;color:#0b0a1c}
#v{position:absolute;inset:0;top:42px;cursor:grab;touch-action:none}
#v.d{cursor:grabbing}
img{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated;user-select:none;-webkit-user-drag:none}
#h{margin-left:auto;color:#6e6aa6}
</style></head><body>
<div id="bar"><b>YANGON · world map</b>
<button data-i="world" class="on">Full world</button><button data-i="view_campus">Campus</button><button data-i="view_tech">Tech hub</button><button data-i="view_home">Home</button><button data-i="view_lake">Lake</button><button data-i="view_market">Market</button><button data-i="view_riverfront">Riverfront</button>
<span id="h">drag to pan · wheel / pinch to zoom · double-click to reset</span></div>
<div id="v"><img id="im" alt="map"></div>
<script>
const v=document.getElementById('v'),im=document.getElementById('im');let s=1,x=0,y=0;
const ap=()=>im.style.transform=`translate(${x}px,${y}px) scale(${s})`;
function fit(){const w=v.clientWidth,h=v.clientHeight,iw=im.naturalWidth,ih=im.naturalHeight;s=Math.min(w/iw,h/ih);x=(w-iw*s)/2;y=(h-ih*s)/2;ap()}
function load(n){im.onload=fit;im.src=n+'.png'}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(o=>o.classList.remove('on'));b.classList.add('on');load(b.dataset.i)});
function zoom(f,cx,cy){const n=Math.max(.1,Math.min(16,s*f));x=cx-(cx-x)*n/s;y=cy-(cy-y)*n/s;s=n;ap()}
v.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.2:1/1.2,e.clientX,e.clientY-42)},{passive:false});
const P=new Map();let pd=0;
v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);P.set(e.pointerId,e);v.classList.add('d');pd=0});
v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);
 if(P.size===1){x+=e.clientX-o.clientX;y+=e.clientY-o.clientY;ap()}
 else{const q=[...P.values()].find(t=>t.pointerId!==e.pointerId);const d0=Math.hypot(o.clientX-q.clientX,o.clientY-q.clientY),d1=Math.hypot(e.clientX-q.clientX,e.clientY-q.clientY);zoom(d1/d0,(e.clientX+q.clientX)/2,(e.clientY+q.clientY)/2-42)}
 P.set(e.pointerId,e)});
const up=e=>{P.delete(e.pointerId);if(!P.size)v.classList.remove('d')};
v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);v.addEventListener('dblclick',fit);
addEventListener('resize',fit);load('world');
</script></body></html>
