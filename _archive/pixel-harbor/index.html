<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Harbor Town</title>
<style>
/* world: muted timber harbor diorama at 640x360 internal pixels, scaled with hard edges */
:root { --bg: #1e2026; --ink: #cbbba6; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#cap {
  position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%);
  font: 12px/1.3 ui-monospace, Consolas, monospace; color: var(--ink);
  opacity: .7; pointer-events: none; white-space: nowrap;
}
</style>
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div id="cap">640 x 360 pixels · 2:1 isometric · effects by pixelfx (MIT)</div>
<script type="module">
import { createFrame, clearFrame, createFx, composite, painterFor, Particles, P as PK, hex } from "./pixelfx/core/index.js";
import * as blossomsFx from "./pixelfx/fx/weather/cherry-blossoms.js";

const VW = 640, VH = 360, N = 16, OX = 320, OY = 70;
const cv = document.getElementById('c');
const mctx = cv.getContext('2d', { willReadFrequently: true });
const groundCv = document.createElement('canvas');
groundCv.width = VW; groundCv.height = VH;
const gctx = groundCv.getContext('2d');
let g = mctx;

function fit() {
  const m = Math.min(innerWidth / VW, innerHeight / VH);
  const s = m >= 1 ? Math.floor(m) : m;
  cv.style.width = VW * s + 'px';
  cv.style.height = VH * s + 'px';
}
fit(); addEventListener('resize', fit);

// ---------- palette (sampled from the reference: warm brown ink, slate, pink stone, cream) ----------
const C = {
  bg: '#2a2b33', ink: '#341b10', ink2: '#4b2d1b', shadow: '#3a3352',
  wood0: '#4b2d1b', wood1: '#6f452b', wood2: '#8a5c36', wood3: '#a67149', wood4: '#c19874',
  cream0: '#a29581', cream1: '#cbbba6', cream2: '#d6caaf', cream3: '#e8dfc1', cream4: '#f4eedb',
  slate0: '#394339', slate1: '#52635a', slate2: '#6c7c76', slate3: '#8e9a94', slate4: '#b0b8ac',
  rust0: '#5e2e24', rust1: '#84443a', rust2: '#a35e4a', rust3: '#c08066', rust4: '#d8a68a',
  stone0: '#5c5652', stone1: '#7a736c', stone2: '#958e84', stone3: '#b5ab9c', stone4: '#d0c7b8',
  cobA: '#bfa696', cobB: '#b09584', cobC: '#9b8170', cobD: '#cfb9aa',
  road0: '#86827a', road1: '#8f8b83', road2: '#a29d93',
  w0: '#2e5f68', w1: '#3f7a82', w2: '#548f94', w3: '#80b2b0', w4: '#cfe6dc',
  g0: '#3e5233', g1: '#56703f', g2: '#6a8848', g3: '#86a25a', g4: '#a9bf78',
  van0: '#2e4c42', van1: '#3d6455', van2: '#52806a', van3: '#82ad94',
  glass: '#e6c47c', glass2: '#f6e2a8', glassB: '#9cbcb8',
  iron: '#3a3640', iron2: '#5a5560', pink: '#e09aa8', yel: '#e6c862', vio: '#9c88c4', red: '#c06a58', white: '#f6f1e4', skin: '#efc6a0', skin2: '#c98f6c'
};
const hh = (a, b, c = 0) => {
  let n = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
};

// ---------- pixel primitives ----------
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.floor(x), Math.floor(y), w, h); };
const P = (gx, gy, z = 0) => [Math.round(OX + (gx - gy) * 16), Math.round(OY + (gx + gy) * 8 - z)];
function poly(pts, c) {
  let mn = 1e9, mx = -1e9;
  for (const p of pts) { if (p[1] < mn) mn = p[1]; if (p[1] > mx) mx = p[1]; }
  g.fillStyle = c;
  for (let y = mn; y < mx; y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
    }
    if (xs.length < 2) continue;
    const x0 = Math.round(Math.min(...xs)), x1 = Math.round(Math.max(...xs));
    if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
  }
}
function line(a, b, c) {
  let [x0, y0] = a; const [x1, y1] = b;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  g.fillStyle = c;
  for (;;) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
function outline(pts, c) { for (let i = 0; i < pts.length; i++) line(pts[i], pts[(i + 1) % pts.length], c); }
function disc(cx, cy, r, c) {
  for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); R(cx - w, cy + y, 2 * w + 1, 1, c); }
}
function ell(cx, cy, rx, ry, c) {
  for (let y = -ry; y <= ry; y++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry)))); R(cx - w, cy + y, 2 * w + 1, 1, c); }
}
function oRect(x, y, w, h, fill, out) { R(x - 1, y - 1, w + 2, h + 2, out); R(x, y, w, h, fill); }
function alpha(a, fn) { const o = g.globalAlpha; g.globalAlpha = a; fn(); g.globalAlpha = o; }

// glow spots collected while drawing, lit afterwards through pixelfx's additive light layer
let GLOWS = [];
const glowAt = (x, y, r, c, k) => GLOWS.push([x, y, r, c, k]);

// ---------- 3x5 font ----------
const FONT = {
  A: '010101111101101', B: '110101110101110', E: '111100110100111', K: '101101110101101',
  R: '110101110101101', Y: '101101010010010', H: '101101111101101', O: '010101101101010'
};
function text(s, x, y, c) {
  for (const ch of s) {
    const gl = FONT[ch];
    if (gl) for (let i = 0; i < 15; i++) if (gl[i] === '1') R(x + (i % 3), y + Math.floor(i / 3), 1, 1, c);
    x += 4;
  }
}

// ---------- ground ----------
function typeAt(gx, gy) {
  if (gx >= 13) return 'water';
  if (gx >= 10) return 'wood';
  if (gy >= 12) return 'road';
  if (gx >= 3 && gy >= 4) return 'cobble';
  return 'grass';
}
function planksTop(gx, gy, w, d, z, seed) {
  const n = Math.max(1, Math.round(d * 4));
  for (let i = 0; i < n; i++) {
    const y0 = gy + (i * d) / n, y1 = gy + ((i + 1) * d) / n;
    const t = hh(Math.floor(gx), Math.floor(gy * 4) + i, seed);
    poly([P(gx, y0, z), P(gx + w, y0, z), P(gx + w, y1, z), P(gx, y1, z)], t < 0.4 ? C.wood3 : t < 0.8 ? '#9a6844' : C.wood4);
    line(P(gx, y1, z), P(gx + w, y1, z), C.wood1);
    for (let k = 0; k < Math.ceil(w); k++) {
      const jx = gx + k + hh(k + Math.floor(gx), i + Math.floor(gy * 4), seed + 7) * 0.9;
      if (jx < gx + w) { const a = P(jx, y0, z), b = P(jx, y1, z); line([a[0], a[1] + 1], [b[0], b[1] - 1], C.wood2); }
    }
  }
}
function tuft(x, y, c1, c2) { R(x, y, 1, 1, c1); R(x - 1, y - 1, 1, 1, c1); R(x + 1, y - 1, 1, 1, c1); R(x, y - 2, 1, 1, c2); }
function drawTile(gx, gy) {
  const t = typeAt(gx, gy);
  const z = t === 'water' ? -5 : 0;
  const corners = [P(gx, gy, z), P(gx + 1, gy, z), P(gx + 1, gy + 1, z), P(gx, gy + 1, z)];
  if (t === 'grass') {
    poly(corners, hh(gx >> 1, gy >> 1) < 0.5 ? C.g2 : '#668444');
    for (let i = 0; i < 2; i++) {
      const [x, y] = P(gx + 0.2 + hh(gx, gy, i + 1) * 0.6, gy + 0.2 + hh(gx, gy, i + 40) * 0.6, 0);
      tuft(x, y, C.g1, C.g3);
    }
    if (gy < 4 && hh(gx, gy, 9) > 0.45) {
      for (let i = 0; i < 4; i++) {
        const [x, y] = P(gx + 0.3 + hh(gx, gy, i + 60) * 0.4, gy + 0.3 + hh(gx, gy, i + 70) * 0.4, 0);
        R(x, y + 1, 1, 1, C.g0); R(x - 1, y - 1, 2, 2, [C.pink, C.yel, C.white, C.vio][(gx + gy + i) % 4]);
      }
    }
  } else if (t === 'cobble') {
    poly(corners, C.cobC);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
      const [x, y] = P(gx + (c + 0.5 + (r % 2) * 0.28) / 4, gy + (r + 0.5) / 4, 0);
      const k = hh(gx * 4 + c, gy * 4 + r);
      R(x - 3, y - 1, 6, 2, k < 0.45 ? C.cobA : k < 0.9 ? C.cobB : C.cobD);
      R(x - 2, y - 1, 3, 1, k < 0.45 ? C.cobD : C.cobA);
    }
    // trim where the plaza meets grass
    if (gx === 3) { line(P(3, gy, 0), P(3, gy + 1, 0), C.stone4); const a = P(3, gy, 0), b = P(3, gy + 1, 0); line([a[0] + 1, a[1]], [b[0] + 1, b[1]], C.stone2); }
    if (gy === 4) { line(P(gx, 4, 0), P(gx + 1, 4, 0), C.stone4); const a = P(gx, 4, 0), b = P(gx + 1, 4, 0); line([a[0], a[1] + 1], [b[0], b[1] + 1], C.stone2); }
  } else if (t === 'road') {
    poly(corners, C.road0);
    if (gy === 13 && gx % 2 === 0) poly([P(gx + 0.15, gy + 0.92, 0), P(gx + 0.85, gy + 0.92, 0), P(gx + 0.85, gy + 1.08, 0), P(gx + 0.15, gy + 1.08, 0)], C.cream2);
    if (gy === 12) {
      // curb: a raised stone lip between plaza and road
      poly([P(gx, 12, 2), P(gx + 1, 12, 2), P(gx + 1, 12.14, 2), P(gx, 12.14, 2)], C.stone4);
      poly([P(gx, 12.14, 2), P(gx + 1, 12.14, 2), P(gx + 1, 12.14, 0), P(gx, 12.14, 0)], C.stone2);
      line(P(gx, 12.14, 0), P(gx + 1, 12.14, 0), C.stone1);
    }
  } else if (t === 'wood') {
    planksTop(gx, gy, 1, 1, 0, 3);
  } else {
    poly(corners, gx === 13 ? C.w2 : gx === 14 ? '#4a858b' : C.w1);
  }
  // side faces
  if (t === 'water') {
    if (gy === N - 1) { poly([P(gx, N, -5), P(gx + 1, N, -5), P(gx + 1, N, -19), P(gx, N, -19)], C.w0); line(P(gx, N, -5), P(gx + 1, N, -5), C.w3); }
    if (gx === N - 1) { poly([P(N, gy, -5), P(N, gy + 1, -5), P(N, gy + 1, -19), P(N, gy, -19)], '#27525a'); line(P(N, gy, -5), P(N, gy + 1, -5), C.w2); }
  } else {
    if (gy === N - 1) {
      const wood = t === 'wood';
      poly([P(gx, N, 0), P(gx + 1, N, 0), P(gx + 1, N, -14), P(gx, N, -14)], wood ? C.wood2 : C.stone2);
      for (const zz of [-4, -9]) line(P(gx, N, zz), P(gx + 1, N, zz), wood ? C.wood1 : C.stone1);
      if (!wood) for (let k = 0; k < 2; k++) { const a = P(gx + 0.25 + k * 0.5 + (gx % 2) * 0.1, N, -4); R(a[0], a[1] + 1, 1, 4, C.stone1); }
      line(P(gx, N, 0), P(gx + 1, N, 0), wood ? C.wood4 : C.stone4);
      line(P(gx, N, -14), P(gx + 1, N, -14), C.ink2);
    }
    if (gx === 12) {
      poly([P(13, gy, 0), P(13, gy + 1, 0), P(13, gy + 1, -5), P(13, gy, -5)], C.stone2);
      line(P(13, gy, -2), P(13, gy + 1, -2), C.stone1);
      line(P(13, gy, 0), P(13, gy + 1, 0), C.stone4);
    }
  }
  if (gx === 0 && t !== 'water') {
    poly([P(0, gy, 0), P(0, gy + 1, 0), P(0, gy + 1, -14), P(0, gy, -14)], C.stone1);
    line(P(0, gy, 0), P(0, gy + 1, 0), C.stone3);
  }
}
function drawGround() {
  g = gctx;
  g.fillStyle = C.bg; g.fillRect(0, 0, VW, VH);
  for (let s = 0; s <= 2 * (N - 1); s++)
    for (let gx = 0; gx < N; gx++) { const gy = s - gx; if (gy >= 0 && gy < N) drawTile(gx, gy); }
  g = mctx;
}

// ---------- 3D helpers ----------
function shadowRect(gx, gy, w, d, len) {
  alpha(0.28, () => poly([P(gx + w, gy), P(gx + w + len, gy + len * 0.15), P(gx + w + len, gy + d + len * 0.15), P(gx + w, gy + d)], C.shadow));
  // contact shadow hugging the two front walls
  alpha(0.32, () => {
    poly([P(gx, gy + d), P(gx + w, gy + d), P(gx + w, gy + d + 0.14), P(gx, gy + d + 0.14)], C.shadow);
    poly([P(gx + w, gy), P(gx + w + 0.14, gy), P(gx + w + 0.14, gy + d), P(gx + w, gy + d)], C.shadow);
  });
}
function box(gx, gy, w, d, z0, h, c) {
  const A = P(gx, gy, z0 + h), B = P(gx + w, gy, z0 + h), Cc = P(gx + w, gy + d, z0 + h), D = P(gx, gy + d, z0 + h);
  const Cb = P(gx + w, gy + d, z0), Db = P(gx, gy + d, z0), Bb = P(gx + w, gy, z0);
  poly([D, Cc, Cb, Db], c.left); poly([Cc, B, Bb, Cb], c.right); poly([A, B, Cc, D], c.top);
  if (c.line) { outline([A, B, Cc, D], c.line); line(D, Db, c.line); line(Cc, Cb, c.line); line(B, Bb, c.line); line(Db, Cb, c.line); line(Cb, Bb, c.line); }
}
const woodBox = { top: C.wood4, left: C.wood3, right: C.wood2, line: C.ink2 };
const stoneBox = { top: C.stone4, left: C.stone3, right: C.stone2, line: C.stone0 };

function faces(b) {
  return {
    L: (u, v) => P(b.gx + u, b.gy + b.d, b.z + v),
    Rf: (u, v) => P(b.gx + b.w, b.gy + u, b.z + v)
  };
}
const quad = (f, u0, v0, u1, v1, c) => poly([f(u0, v1), f(u1, v1), f(u1, v0), f(u0, v0)], c);

function winOn(f, uc, v0, v1, uw, boxFlowers) {
  quad(f, uc - uw / 2 - 0.07, v0 - 1, uc + uw / 2 + 0.07, v1 + 2, C.ink2);
  quad(f, uc - uw / 2, v0, uc + uw / 2, v1, C.glass);
  quad(f, uc - uw / 2, v1 - 4, uc + uw / 2, v1, C.glassB);
  quad(f, uc - uw / 2, v0, uc - uw / 2 + uw * 0.35, v0 + 3, C.glass2);
  quad(f, uc - 0.03, v0, uc + 0.03, v1, C.wood2);
  quad(f, uc - uw / 2, (v0 + v1) / 2 - 0.5, uc + uw / 2, (v0 + v1) / 2 + 0.5, C.wood2);
  quad(f, uc - uw / 2 - 0.1, v0 - 3, uc + uw / 2 + 0.1, v0 - 1, C.wood3);
  quad(f, uc - uw / 2 - 0.1, v0 - 3, uc + uw / 2 + 0.1, v0 - 2, C.wood4);
  const m = f(uc, (v0 + v1) / 2);
  glowAt(m[0], m[1], 6, '#ffcf7a', 0.16);
  if (boxFlowers) {
    quad(f, uc - uw / 2 - 0.05, v0 - 5, uc + uw / 2 + 0.05, v0 - 2, C.wood2);
    for (let i = 0; i < 5; i++) {
      const p = f(uc - uw / 2 + (i + 0.5) * (uw / 5), v0 - 5);
      R(p[0], p[1] + 1, 1, 1, C.g1);
      R(p[0], p[1] - 1, 2, 2, [C.pink, C.yel, C.white, C.vio, C.pink][i]);
    }
  }
}
// board siding: a dark seam and a lit lip under it every 3 rows
function wallFace(f, len, h, c1, c2, c3) {
  quad(f, 0, 0, len, h, c1);
  for (let v = 3; v < h; v += 3) { quad(f, 0, v, len, v + 1, c2); if (c3) quad(f, 0, v - 1, len, v, c3); }
}
function post(f, u, h) { quad(f, u - 0.05, 0, u + 0.05, h, C.wood2); quad(f, u - 0.05, 0, u - 0.02, h, C.wood3); }
// silhouette ink, a lit front corner and a dark base on a building's two visible walls
function buildingEdges(b) {
  const { L, Rf } = faces(b);
  quad(L, 0, 0, b.w, 2, C.stone0); quad(Rf, 0, 0, b.d, 2, '#4a4440');
  quad(L, b.w - 0.05, 2, b.w, b.h, C.cream4);
  line(L(0, 0), L(0, b.h), C.ink2); line(L(b.w, 0), L(b.w, b.h), C.ink2); line(Rf(b.d, 0), Rf(b.d, b.h), C.ink2);
  line(L(0, 0), L(b.w, 0), C.ink2); line(Rf(0, 0), Rf(b.d, 0), C.ink2);
}

function roofX(b, rh, cols, ov = 0.28) {
  const x0 = b.gx - 0.1, x1 = b.gx + b.w + 0.1, ym = b.gy + b.d / 2, y1 = b.gy + b.d + ov, z = b.z;
  const gz = z - 1;
  poly([P(b.gx + b.w, b.gy, z), P(b.gx + b.w, b.gy + b.d, z), P(b.gx + b.w, ym, z + rh)], cols.wall);
  gableBeams(b.gx + b.w, b.gy, b.d, z, rh);
  const n = 8;
  for (let k = 0; k < n; k++) {
    const f0 = k / n, f1 = (k + 1) / n;
    const ya = y1 + (ym - y1) * f0, yb = y1 + (ym - y1) * f1;
    poly([P(x0, ya, gz + (rh + 1) * f0), P(x1, ya, gz + (rh + 1) * f0), P(x1, yb, gz + (rh + 1) * f1), P(x0, yb, gz + (rh + 1) * f1)], k % 2 ? cols.a : cols.b);
    line(P(x0, ya, gz + (rh + 1) * f0), P(x1, ya, gz + (rh + 1) * f0), cols.d);
    for (let s = 0; s < Math.ceil(b.w * 2.5); s++) {
      const xs = x0 + 0.25 + s * 0.4 + (k % 2) * 0.2;
      if (xs < x1) { const a = P(xs, ya, gz + (rh + 1) * f0), c2 = P(xs, yb, gz + (rh + 1) * f1); line([a[0], a[1] - 1], [c2[0], c2[1]], cols.d); }
    }
  }
  line(P(x0, ym, z + rh), P(x1, ym, z + rh), cols.hi);
  const ra = P(x0, ym, z + rh), rb = P(x1, ym, z + rh);
  line([ra[0], ra[1] + 1], [rb[0], rb[1] + 1], cols.d);
  line([ra[0], ra[1] - 1], [rb[0], rb[1] - 1], C.ink2);
  line(P(x1, y1, gz), P(x1, ym, z + rh), C.ink2);
  line(P(x0, y1, gz), P(x0, ym, z + rh), C.ink2);
  line(P(x0, y1, gz), P(x1, y1, gz), C.ink2);
  line(P(x0, y1, gz + 1), P(x1, y1, gz + 1), cols.hi);
}
function gableBeams(x, gy, d, z, rh) {
  line(P(x, gy, z), P(x, gy + d / 2, z + rh), C.wood2);
  line(P(x, gy + d, z), P(x, gy + d / 2, z + rh), C.wood2);
  line(P(x, gy + d / 2, z), P(x, gy + d / 2, z + rh), C.wood2);
  const w = P(x, gy + d / 2, z + rh * 0.38);
  R(w[0] - 2, w[1], 4, 4, C.glass); R(w[0] - 3, w[1] - 1, 6, 1, C.ink2);
  glowAt(w[0], w[1] + 2, 5, '#ffcf7a', 0.14);
}
function roofY(b, rh, cols, ov = 0.28) {
  const xm = b.gx + b.w / 2, x1 = b.gx + b.w + ov, y0 = b.gy - 0.1, y1 = b.gy + b.d + 0.1, z = b.z, gz = z - 1;
  poly([P(b.gx, b.gy + b.d, z), P(b.gx + b.w, b.gy + b.d, z), P(xm, b.gy + b.d, z + rh)], cols.wall);
  line(P(b.gx, b.gy + b.d, z), P(xm, b.gy + b.d, z + rh), C.wood2);

function waterFx(t) {
  for (let gx = 13; gx < N; gx++) for (let gy = 0; gy < N; gy++) {
    const ph = (t * 0.3 + hh(gx, gy, 2)) % 1;
    if (ph < 0.2 || ph > 0.8) continue;
    const p = P(gx + hh(gx, gy, 4), gy + hh(gx, gy, 7), -5);
    R(p[0], p[1], 4, 1, C.w3); R(p[0] + 1, p[1] + 1, 2, 1, C.w2);
  }
  for (let gy = 0; gy < N; gy++) {
    const a = P(13, gy, -5), b = P(13, gy + 1, -5);
    for (let k = 0; k < 4; k++) {
      const f = ((t * 0.25 + k / 4 + gy * 0.37) % 1);
      const x = Math.round(a[0] + (b[0] - a[0]) * f), y = Math.round(a[1] + (b[1] - a[1]) * f);
      R(x + 2, y + 1, 3, 1, C.w4); if (k % 2) R(x + 5, y + 2, 2, 1, C.w3);
    }
  }
  for (const [px, py] of [[13.2, 9.8], [15.8, 9.8], [15.8, 7.1]]) {
    const p = P(px, py, -5), r = 3 + Math.round(((t * 1.2) % 1) * 3);
    R(p[0] - r, p[1] + 3, 2, 1, C.w4); R(p[0] + r - 1, p[1] + 3, 2, 1, C.w4);
  }
}

// ---------- pixelfx layer: blossoms, chimney smoke, additive light ----------
const frame = createFrame(VW, VH);
const blossoms = createFx(blossomsFx, { x: 330, y: 214, seed: 5, palette: ['#5a2a3c', '#9a4a66', '#d58aa2', '#eab0c0', '#f6d4dc', '#fff4f6'] });
const smoke = new Particles({ seed: 4 });
const CHIM = P(7.0, 1.4, 81);
let smokeAcc = 0;
function stepFx(dt) {
  blossoms.update(dt);
  smokeAcc += dt;
  while (smokeAcc > 0.28) {
    smokeAcc -= 0.28;
    // vapour keeps its own pale color as it fades; pixelfx's SMOKE darkens toward the backdrop
    smoke.spawn(PK.VAPOUR, CHIM[0] + (Math.random() - 0.5) * 3, CHIM[1], 7 + Math.random() * 5, -16 - Math.random() * 6, 3.6 + Math.random(), '#f4f0e8', 4.4);
  }
  smoke.update(dt);
  // vapour has heavy drag and barely rises on its own, so carry the puffs up and downwind
  for (const q of smoke.list) { q.y -= 11 * dt; q.x += 5 * dt; }
}
// start mid-loop so the very first frame already has smoke and petals in the air
for (let i = 0; i < 120; i++) stepFx(1 / 30);
function fxPass(dt) {
  stepFx(dt);
  clearFrame(frame);
  const p = painterFor(frame);
  p.place(0, 0);
  smoke.draw(p);
  for (const [x, y, r, c, k] of GLOWS) p.glow(x, y, r, hex(c), k);
  blossoms.draw(frame, 'front');
}

// ---------- frame ----------
drawGround();
let last = 0;
function draw(ms) {
  const t = ms / 1000, dt = Math.min(0.1, last ? t - last : 1 / 60);
  last = t;
  g = mctx;
  GLOWS = [];
  g.drawImage(groundCv, 0, 0);
  waterFx(t);
  shadows.forEach(s => s());
  const list = objs.concat(dyn(t));
  list.sort((a, b) => a.d - b.d);
  for (const o of list) o.fn(t);
  alpha(0.05, () => R(0, 0, VW, VH, '#ffc890'));
  fxPass(dt);
  const img = mctx.getImageData(0, 0, VW, VH);
  composite(frame, img.data, new Uint32Array(img.data.buffer));
  mctx.putImageData(img, 0, 0);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
